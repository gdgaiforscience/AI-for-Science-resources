<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resource Cards</title>
  <link rel="stylesheet" href="style.css">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-1N15QXYVXM"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-97ZCJH3VGG');
  </script>
</head>
<body>
  <div class="header-container">
    <h1>AI for Science Resources</h1>
    <p>Explore key Google platforms, catalogs, and communities to share, accelerate, and scale your research.</p>
  </div>

  <section class="text-center">
    <div id="domain-filters">
      <span class="filter-label">Domain:</span>
      <button id="Health" class="btnFilter">Health</button>
      <button id="Earth" class="btnFilter">Earth</button>
      <button id="Engineering" class="btnFilter">Engineering and Physics</button>
      <button id="Humanities" class="btnFilter">Humanities</button>
      <button id="Computer" class="btnFilter">Computer Science</button>
    </div>
    <div id="type-filters">
      <span class="filter-label">Type:</span>
      <button id="Program" class="btnFilter">Programs and Partnerships</button>
      <button id="Tool" class="btnFilter">Tools and Platforms</button>
      <button id="Data" class="btnFilter">Datasets</button>
      <button id="Knowledge" class="btnFilter">Knowledge</button>
    </div>
  </section>

  <div class="grid-container" id="resourcesContainer">
    <!-- Cards injected here dynamically by index.js -->
  </div>

  <script src="dataResources.js"></script>
  <script src="index.js"></script>
</body>
</html>
